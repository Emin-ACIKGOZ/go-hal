name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.5", "1.24.11", "stable"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Enforce gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -shuffle=on ./...

      - name: Race
        run: go test -count=1 -race -shuffle=on ./...

      - name: Fuzz smoke tests
        run: |
          for target in FuzzWrapPrecomputed FuzzSplicePrecomputed FuzzMarshal_WithRegisteredGenerator FuzzMarshal_WithoutGenerator FuzzLink_AddLink; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=5s .
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Enforce minimum coverage
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Test coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage < 70.0) exit 1 }'
          echo "Coverage meets the 70% minimum"

  benchmarks:
    name: Benchmarks (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Benchmark head
        run: |
          go test -run='^$' -bench=. -benchmem -cpu=1 -count=10 -benchtime=200ms ./... \
            > "${RUNNER_TEMP}/head.txt"

      - name: Checkout base
        run: git checkout "${{ github.event.pull_request.base.sha }}"

      - name: Benchmark base
        run: |
          go test -run='^$' -bench=. -benchmem -cpu=1 -count=10 -benchtime=200ms ./... \
            > "${RUNNER_TEMP}/base.txt"

      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          benchstat "${RUNNER_TEMP}/base.txt" "${RUNNER_TEMP}/head.txt" | tee "${RUNNER_TEMP}/benchstat.txt"
          {
            echo '## Benchmark comparison (advisory)'
            echo '```'
            cat "${RUNNER_TEMP}/benchstat.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --config=.golangci.yml
