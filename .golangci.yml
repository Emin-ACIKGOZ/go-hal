# .golangci.yml - Standardized Go Linter Configuration (v2)
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # --- Core & Bugs ---
    - bodyclose
    - copyloopvar
    - errcheck
    - govet
    - nilerr
    - noctx
    - reassign
    - staticcheck
    - unused

    # --- Style, Performance & Idioms ---
    - goconst
    - ineffassign
    - misspell
    - mnd
    - perfsprint
    - predeclared
    - revive
    - whitespace

    # --- Complexity & Meta ---
    - cyclop
    - nolintlint

    # --- Security ---
    - gosec

  settings:
    misspell:
      locale: US
    cyclop:
      max-complexity: 10
    goconst:
      ignore-tests: true

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - cyclop

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
